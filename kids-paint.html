<title>لوحة الرسم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* لوحة رسم للأطفال باللمس: ألوان أعلى، لوحة بطبقتين (تلوين تحت وحروف ثابتة فوق)، صور إيموجي وحروف أسفل */
  :root{
    --bg:#fff7ed; --panel:#ffffff; --ink:#3b2f2a; --line:#f0d9c0;
    --accent:#ff7a3d; --shadow:0 6px 0 rgba(0,0,0,.12);
    --r:22px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#241c2b; --panel:#352b3f; --ink:#f6edf6; --line:#4a3d56;
    --accent:#ff9a5c; --shadow:0 6px 0 rgba(0,0,0,.35); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#241c2b; --panel:#352b3f; --ink:#f6edf6; --line:#4a3d56;
    --accent:#ff9a5c; --shadow:0 6px 0 rgba(0,0,0,.35); color-scheme:dark;
  }
  html,body{height:100%}
  body{
    margin:0 auto; max-width:460px; background:var(--bg); color:var(--ink);
    font-family:"Baloo Bhaijaan 2","Comic Sans MS",system-ui,sans-serif;
    display:flex; flex-direction:column;
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px max(14px,env(safe-area-inset-left,0px)) 10px max(14px,env(safe-area-inset-right,0px));
  }
  .swatches{display:flex; gap:9px; flex:1; flex-wrap:wrap; min-width:0}
  .sw{
    width:38px; height:38px; border-radius:50%; border:4px solid #fff;
    box-shadow:var(--shadow); cursor:pointer; padding:0; flex:0 0 auto;
    transition:transform .08s;
  }
  :root[data-theme="dark"] .sw, :root:not([data-theme="light"]) .sw{border-color:#2b2233}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .sw{border-color:#fff} }
  .sw.on{transform:scale(1.28); outline:3px dashed var(--accent); outline-offset:3px}
  .stage{flex:1; min-height:0; position:relative; padding:0 max(14px,env(safe-area-inset-left,0px))}
  .wrap{position:relative; width:100%; height:100%}
  canvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    border-radius:var(--r); touch-action:none;
  }
  #paint{background:#fff; box-shadow:var(--shadow)}
  #lines{background:transparent; pointer-events:none}

  .tray{
    display:flex; gap:9px; align-items:center; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding:8px max(14px,env(safe-area-inset-left,0px));
  }
  .tray.cats{padding-top:4px; padding-bottom:0}
  .pick{
    flex:0 0 auto; width:58px; height:58px; border:none; border-radius:18px;
    background:var(--panel); box-shadow:var(--shadow); cursor:pointer;
    font-size:30px; display:grid; place-items:center; color:var(--ink);
    font-family:inherit; font-weight:800; line-height:1;
  }
  .pick small{font-size:10px; font-weight:700; color:var(--accent); margin-top:2px}
  .pick.pair{flex-direction:column; gap:0}
  .chip{
    flex:0 0 auto; border:none; border-radius:16px; background:var(--panel);
    box-shadow:var(--shadow); cursor:pointer; font-family:inherit; font-weight:700;
    font-size:15px; color:var(--ink); padding:9px 16px;
  }
  .chip.on{background:var(--accent); color:#fff}
  .tools{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap; justify-content:center;
    padding:9px max(14px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));
  }
  .btn{
    font-family:inherit; font-size:16px; font-weight:700; color:var(--ink);
    background:var(--panel); border:none; border-radius:var(--r);
    box-shadow:var(--shadow); padding:11px 15px; cursor:pointer;
    display:flex; align-items:center; gap:6px; min-height:50px;
    transition:transform .08s;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .btn .ic{font-size:21px}
  .btn.on{outline:3px dashed var(--accent); outline-offset:3px}
  .sizes{display:flex; gap:6px; align-items:center; background:var(--panel); border-radius:var(--r); box-shadow:var(--shadow); padding:6px 10px}
  .size{width:42px; height:42px; border:none; background:transparent; cursor:pointer; display:grid; place-items:center; padding:0}
  .size .dot{background:var(--ink); border-radius:50%}
  .size.on{background:var(--accent); border-radius:50%}
  .size.on .dot{background:#fff}
  :focus-visible{outline:3px solid var(--accent); outline-offset:3px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap">

<div class="bar">
  <div class="swatches" id="swatches" role="radiogroup" aria-label="الألوان"></div>
</div>

<div class="stage">
  <div class="wrap">
    <canvas id="paint" aria-label="لوحة الرسم"></canvas>
    <canvas id="lines" aria-hidden="true"></canvas>
  </div>
</div>

<div class="tray cats" id="cats" role="tablist" aria-label="نوع الرسمة">
  <button class="chip on" data-cat="pics">🎨 رسمات</button>
  <button class="chip" data-cat="letters">أ ب ت  حروف</button>
  <button class="chip" data-cat="dino">🦕 ديناصورات</button>
  <button class="chip" data-cat="none" style="margin-inline-start:auto">بلا رسمة</button>
</div>
<div class="tray" id="tray" aria-label="اختر رسمة"></div>

<div class="tools">
  <div class="sizes" role="radiogroup" aria-label="حجم القلم">
    <button class="size" data-size="6" aria-label="رفيع"><span class="dot" style="width:10px;height:10px"></span></button>
    <button class="size on" data-size="16" aria-label="وسط"><span class="dot" style="width:18px;height:18px"></span></button>
    <button class="size" data-size="34" aria-label="عريض"><span class="dot" style="width:28px;height:28px"></span></button>
  </div>
  <button class="btn on" id="brushBtn"><span class="ic">🖍️</span>ألوّن</button>
  <button class="btn" id="eraserBtn"><span class="ic">🧽</span>أمسح</button>
  <button class="btn" id="clearBtn"><span class="ic">✨</span>جديد</button>
</div>

<script>
  "use strict";
  var colors = ["#ff3b3b","#ff7a3d","#ffd21e","#39d353","#1ec8ff","#3d5bff","#b14dff","#ff5fa2","#7a4a27","#111111","#ffffff"];
  var paint = document.getElementById("paint"), pctx = paint.getContext("2d");
  var lines = document.getElementById("lines"), lctx = lines.getContext("2d");
  var state = { color:"#ff3b3b", size:16, erasing:false, template:null };
  var dpr = Math.max(1, Math.min(3, window.devicePixelRatio||1));
  /* رسومات خطّية داخل مربّع 0..100 — خطوط سوداء فارغة يلوّنها الطفل */
  var OUTLINES = {
    star:"M50 8 L61 38 L93 38 L67 58 L77 90 L50 70 L23 90 L33 58 L7 38 L39 38 Z",
    heart:"M50 86 C22 64 10 46 10 32 C10 18 20 10 31 10 C40 10 47 16 50 24 C53 16 60 10 69 10 C80 10 90 18 90 32 C90 46 78 64 50 86 Z",
    flower:"M59 50 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0 M49 67.3 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0 M29 67.3 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0 M19 50 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0 M29 32.7 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0 M49 32.7 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0 M41 50 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0",
    sun:"M32 50 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0 M50 6 L50 18 M50 82 L50 94 M6 50 L18 50 M82 50 L94 50 M20 20 L28 28 M72 72 L80 80 M80 20 L72 28 M28 72 L20 80",
    apple:"M50 32 C41 22 22 24 22 44 C22 64 38 84 50 84 C62 84 78 64 78 44 C78 24 59 22 50 32 Z M50 32 L50 18 M50 22 C58 14 70 15 73 23 C66 30 55 29 50 22 Z",
    fish:"M16 50 C30 34 60 34 78 50 C60 66 30 66 16 50 Z M78 50 L94 38 L94 62 Z M66 44 a2.5 2.5 0 1 0 0.1 0",
    house:"M18 50 L50 22 L82 50 M26 46 L26 84 L74 84 L74 46 M44 84 L44 62 L58 62 L58 84 M34 54 L42 54 L42 62 L34 62 Z",
    car:"M12 66 L20 48 L36 44 L44 34 L66 34 L74 48 L88 50 L88 66 Z M30 66 a8 8 0 1 0 0.1 0 M70 66 a8 8 0 1 0 0.1 0 M46 44 L46 34 M62 44 L66 44",
    balloon:"M50 14 C33 14 27 34 34 48 C38 57 46 61 50 64 C54 61 62 57 66 48 C73 34 67 14 50 14 Z M50 64 L46 70 L54 70 Z M50 70 C57 78 43 84 50 92",
    butterfly:"M50 28 L50 74 M50 34 C33 18 16 28 22 46 C16 58 32 68 50 52 M50 34 C67 18 84 28 78 46 C84 58 68 68 50 52 M50 30 L43 20 M50 30 L57 20",
    tree:"M50 86 L50 56 M40 86 L60 86 M50 56 C28 56 22 36 38 30 C36 16 64 16 62 30 C78 36 72 56 50 56 Z",
    cloud:"M30 68 C16 68 14 52 26 50 C26 36 46 32 50 44 C56 32 78 34 76 50 C88 50 88 68 74 68 Z",
    moon:"M60 14 C42 18 30 32 30 50 C30 68 42 82 60 86 C50 78 44 66 44 50 C44 34 50 22 60 14 Z",
    icecream:"M36 46 L50 88 L64 46 Z M33 46 a9 9 0 1 1 18 0 M40 42 a9 9 0 1 1 18 0 M31 42 a9 9 0 1 1 18 0",
    dinoNeck:"M12 70 C24 60 38 62 48 64 C52 52 52 32 60 26 C64 22 74 22 76 30 C72 31 70 33 70 38 C70 54 64 64 56 70 C44 78 26 80 12 70 Z M26 74 L26 86 M48 72 L48 86 M62 72 L62 84",
    dinoRex:"M10 54 C24 54 34 50 40 42 C44 30 54 26 66 26 L86 30 L86 42 L68 44 C62 46 60 54 58 60 C54 72 40 74 34 64 C26 70 16 64 10 54 Z M44 66 L48 82 L60 82 M60 44 L68 50 M30 36 a2 2 0 1 0 0.1 0",
    croc:"M10 60 C26 54 44 54 60 57 C70 58 80 55 90 60 C82 67 70 65 60 65 C44 65 26 66 10 60 Z M20 60 L18 52 M30 59 L28 51 M66 62 L70 54 M78 61 L82 54 M82 58 a2 2 0 1 0 0.1 0",
    dinoEgg:"M50 14 C33 14 30 46 30 58 C30 78 40 88 50 88 C60 88 70 78 70 58 C70 46 67 14 50 14 Z M34 50 L44 58 L50 48 L58 60 L66 50"
  };
  /* أزرار الصندوق: الاسم ورمزه التوضيحي */
  var PICLIST = [["star","⭐"],["heart","❤️"],["flower","🌸"],["sun","🌞"],["apple","🍎"],["fish","🐟"],["house","🏠"],["car","🚗"],["balloon","🎈"],["butterfly","🦋"],["tree","🌳"],["cloud","☁️"],["moon","🌙"],["icecream","🍦"]];
  var DINOLIST = [["dinoNeck","🦕","ديناصور"],["dinoRex","🦖","تي-ركس"],["croc","🐊","تمساح"],["dinoEgg","🥚","بيضة"]];
  /* الحروف: كل حرف مع صورةٍ تبدأ به وكلمتها */
  var ABC = [
    ["أ","🐰","أرنب"],["ب","🦆","بطة"],["ت","🍎","تفاحة"],["ث","🦊","ثعلب"],
    ["ج","🐫","جمل"],["ح","🐴","حصان"],["خ","🐑","خروف"],["د","🐔","دجاجة"],
    ["ذ","🐺","ذئب"],["ر","🤖","روبوت"],["ز","🦒","زرافة"],["س","🐟","سمكة"],
    ["ش","🌞","شمس"],["ص","🚀","صاروخ"],["ض","🐸","ضفدع"],["ط","✈️","طائرة"],
    ["ظ","✉️","ظرف"],["ع","🍇","عنب"],["غ","🦌","غزال"],["ف","🦋","فراشة"],
    ["ق","🐱","قطة"],["ك","🐶","كلب"],["ل","🍋","ليمونة"],["م","🍌","موزة"],
    ["ن","🐝","نحلة"],["ه","🎁","هدية"],["و","🌹","وردة"],["ي","✋","يد"]
  ];

  function accent(){ try{ return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#ff7a3d"; }catch(e){ return "#ff7a3d"; } }
  /* ---------- رسم الطبقتين: الخطوط فوق، التلوين تحت ---------- */
  function clearPaint(){ pctx.fillStyle="#fff"; pctx.fillRect(0,0,paint.width,paint.height); }
  function drawOutline(name){
    var d=OUTLINES[name]; if(!d) return;
    var W=lines.width,H=lines.height, S=Math.min(W,H)*0.82, ox=(W-S)/2, oy=(H-S)/2;
    lctx.save(); lctx.translate(ox,oy); lctx.scale(S/100,S/100);
    lctx.strokeStyle="#111"; lctx.lineJoin="round"; lctx.lineCap="round"; lctx.lineWidth=280/S;
    try{ lctx.stroke(new Path2D(d)); }catch(e){}
    lctx.restore();
  }
  function drawLetterOutline(ch,word){
    var W=lines.width,H=lines.height, sz=Math.min(W,H*0.6)*0.78;
    lctx.strokeStyle="#111"; lctx.lineJoin="round";
    lctx.font="800 "+sz+"px 'Baloo Bhaijaan 2', sans-serif";
    lctx.textAlign="center"; lctx.textBaseline="middle"; lctx.lineWidth=Math.max(6,sz*0.05);
    lctx.strokeText(ch, W/2, H*0.42);
    if(word){ var fs=Math.max(18,Math.min(W,H)*0.08);
      lctx.font="800 "+fs+"px 'Baloo Bhaijaan 2',sans-serif";
      lctx.fillStyle=accent(); lctx.textBaseline="alphabetic"; lctx.fillText(ch+" … "+word, W/2, H*0.93); }
  }
  function redrawLines(){
    lctx.clearRect(0,0,lines.width,lines.height);
    var t=state.template; if(!t) return;
    if(t.t==="pic") drawOutline(t.name);
    else if(t.t==="letter") drawLetterOutline(t.ch,t.word);
  }
  function renderTemplate(){ clearPaint(); redrawLines(); }
  function setTemplate(t){ state.template=t; renderTemplate(); }

  /* ---------- الطبقتان وتغيير الحجم ---------- */
  function sizeCanvas(c){ var r=paint.getBoundingClientRect(); c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr); }
  function resize(){
    var snap=null; try{ snap=(paint.width>0)?pctx.getImageData(0,0,paint.width,paint.height):null; }catch(e){}
    sizeCanvas(paint); sizeCanvas(lines);
    clearPaint();
    if(snap){ try{ pctx.putImageData(snap,0,0); }catch(e){} }
    pctx.lineCap="round"; pctx.lineJoin="round";
    redrawLines();
  }

  /* ---------- شريط الألوان ---------- */
  var sw=document.getElementById("swatches");
  colors.forEach(function(c,i){
    var b=document.createElement("button");
    b.className="sw"+(i===0?" on":""); b.style.background=c;
    b.setAttribute("role","radio"); b.setAttribute("aria-checked",i===0?"true":"false"); b.setAttribute("aria-label","لون");
    b.addEventListener("pointerdown",function(){
      state.color=c; state.erasing=false; setBrush(true);
      [].forEach.call(sw.children,function(x){x.classList.remove("on");x.setAttribute("aria-checked","false");});
      b.classList.add("on"); b.setAttribute("aria-checked","true");
    });
    sw.appendChild(b);
  });

  /* ---------- الأحجام ---------- */
  [].forEach.call(document.querySelectorAll(".size"),function(s){
    s.addEventListener("pointerdown",function(){
      state.size=Number(s.dataset.size);
      document.querySelectorAll(".size").forEach(function(x){x.classList.remove("on");});
      s.classList.add("on");
    });
  });

  /* ---------- القلم والممحاة ---------- */
  var brushBtn=document.getElementById("brushBtn"), eraserBtn=document.getElementById("eraserBtn");
  function setBrush(on){ state.erasing=!on; brushBtn.classList.toggle("on",on); eraserBtn.classList.toggle("on",!on); }
  brushBtn.addEventListener("pointerdown",function(){ setBrush(true); });
  eraserBtn.addEventListener("pointerdown",function(){ setBrush(false); });
  document.getElementById("clearBtn").addEventListener("pointerdown",function(){ renderTemplate(); });

  /* ---------- صندوق الرسمات والحروف والديناصورات ---------- */
  var tray=document.getElementById("tray"), cats=document.getElementById("cats");
  function buildTray(cat){
    tray.innerHTML="";
    if(cat==="none"){ tray.hidden=true; setTemplate(null); return; }
    tray.hidden=false;
    if(cat==="pics"){
      PICLIST.forEach(function(p){
        var b=document.createElement("button"); b.className="pick"; b.textContent=p[1]; b.setAttribute("aria-label","رسمة");
        b.addEventListener("pointerdown",function(){ setTemplate({t:"pic",name:p[0]}); }); tray.appendChild(b);
      });
    } else if(cat==="dino"){
      DINOLIST.forEach(function(d){
        var b=document.createElement("button"); b.className="pick pair"; b.setAttribute("aria-label",d[2]);
        b.innerHTML="<span>"+d[1]+"</span><small>"+d[2]+"</small>";
        b.addEventListener("pointerdown",function(){ setTemplate({t:"pic",name:d[0]}); }); tray.appendChild(b);
      });
    } else {
      ABC.forEach(function(it){
        var b=document.createElement("button"); b.className="pick pair"; b.setAttribute("aria-label","حرف "+it[0]+" "+it[2]);
        b.innerHTML="<span>"+it[0]+"</span><small>"+it[2]+"</small>";
        b.addEventListener("pointerdown",function(){ setTemplate({t:"letter",ch:it[0],word:it[2]}); }); tray.appendChild(b);
      });
    }
  }
  [].forEach.call(cats.children,function(chip){
    chip.addEventListener("pointerdown",function(){
      [].forEach.call(cats.children,function(x){x.classList.remove("on");}); chip.classList.add("on");
      buildTray(chip.dataset.cat);
    });
  });

  /* ---------- الرسم ---------- */
  var drawing=false,lastX=0,lastY=0;
  function pos(e){ var r=paint.getBoundingClientRect(); return {x:(e.clientX-r.left)*dpr,y:(e.clientY-r.top)*dpr}; }
  function dot(x,y){ pctx.beginPath(); pctx.fillStyle=state.erasing?"#fff":state.color; pctx.arc(x,y,(state.size*dpr)/2,0,Math.PI*2); pctx.fill(); }
  paint.addEventListener("pointerdown",function(e){ e.preventDefault(); drawing=true; try{paint.setPointerCapture(e.pointerId);}catch(_){} var p=pos(e); lastX=p.x; lastY=p.y; dot(p.x,p.y); });
  paint.addEventListener("pointermove",function(e){
    if(!drawing) return; e.preventDefault();
    var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[e];
    for(var i=0;i<evs.length;i++){ var p=pos(evs[i]);
      pctx.strokeStyle=state.erasing?"#fff":state.color; pctx.lineWidth=state.size*dpr;
      pctx.beginPath(); pctx.moveTo(lastX,lastY); pctx.lineTo(p.x,p.y); pctx.stroke(); lastX=p.x; lastY=p.y; }
  });
  function stop(){ drawing=false; }
  paint.addEventListener("pointerup",stop); paint.addEventListener("pointercancel",stop); paint.addEventListener("pointerleave",stop);

  window.addEventListener("resize",resize);
  resize();
  buildTray("pics");
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(redrawLines); }
</script>
