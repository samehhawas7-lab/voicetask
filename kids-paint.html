<title>لوحة الرسم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* لوحة رسم للأطفال باللمس: ألوان أعلى، لوحة بطبقتين (تلوين تحت وخطوط ثابتة فوق)، صندوق رسمات وحروف مع صورها أسفل */
  :root{
    --bg:#fff7ed; --panel:#ffffff; --ink:#3b2f2a; --line:#f0d9c0;
    --accent:#ff7a3d; --shadow:0 6px 0 rgba(0,0,0,.12);
    --r:22px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#241c2b; --panel:#352b3f; --ink:#f6edf6; --line:#4a3d56;
    --accent:#ff9a5c; --shadow:0 6px 0 rgba(0,0,0,.35); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#241c2b; --panel:#352b3f; --ink:#f6edf6; --line:#4a3d56;
    --accent:#ff9a5c; --shadow:0 6px 0 rgba(0,0,0,.35); color-scheme:dark;
  }
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Baloo Bhaijaan 2","Comic Sans MS",system-ui,sans-serif;
    display:flex; flex-direction:column;
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px max(14px,env(safe-area-inset-left,0px)) 10px max(14px,env(safe-area-inset-right,0px));
  }
  .swatches{display:flex; gap:9px; flex:1; flex-wrap:wrap; min-width:0}
  .sw{
    width:38px; height:38px; border-radius:50%; border:4px solid #fff;
    box-shadow:var(--shadow); cursor:pointer; padding:0; flex:0 0 auto;
    transition:transform .08s;
  }
  :root[data-theme="dark"] .sw, :root:not([data-theme="light"]) .sw{border-color:#2b2233}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .sw{border-color:#fff} }
  .sw.on{transform:scale(1.28); outline:3px dashed var(--accent); outline-offset:3px}
  .stage{flex:1; min-height:0; position:relative; padding:0 max(14px,env(safe-area-inset-left,0px))}
  .wrap{position:relative; width:100%; height:100%}
  canvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    border-radius:var(--r); touch-action:none;
  }
  #paint{background:#fff; box-shadow:var(--shadow)}
  #lines{background:transparent; pointer-events:none}

  .tray{
    display:flex; gap:9px; align-items:center; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding:8px max(14px,env(safe-area-inset-left,0px));
  }
  .tray.cats{padding-top:4px; padding-bottom:0}
  .pick{
    flex:0 0 auto; width:58px; height:58px; border:none; border-radius:18px;
    background:var(--panel); box-shadow:var(--shadow); cursor:pointer;
    font-size:30px; display:grid; place-items:center; color:var(--ink);
    font-family:inherit; font-weight:800; line-height:1;
  }
  .pick small{font-size:10px; font-weight:700; color:var(--accent); margin-top:2px}
  .pick.pair{flex-direction:column; gap:0}
  .chip{
    flex:0 0 auto; border:none; border-radius:16px; background:var(--panel);
    box-shadow:var(--shadow); cursor:pointer; font-family:inherit; font-weight:700;
    font-size:15px; color:var(--ink); padding:9px 16px;
  }
  .chip.on{background:var(--accent); color:#fff}
  .tools{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap; justify-content:center;
    padding:9px max(14px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));
  }
  .btn{
    font-family:inherit; font-size:16px; font-weight:700; color:var(--ink);
    background:var(--panel); border:none; border-radius:var(--r);
    box-shadow:var(--shadow); padding:11px 15px; cursor:pointer;
    display:flex; align-items:center; gap:6px; min-height:50px;
    transition:transform .08s;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .btn .ic{font-size:21px}
  .btn.on{outline:3px dashed var(--accent); outline-offset:3px}
  .sizes{display:flex; gap:6px; align-items:center; background:var(--panel); border-radius:var(--r); box-shadow:var(--shadow); padding:6px 10px}
  .size{width:42px; height:42px; border:none; background:transparent; cursor:pointer; display:grid; place-items:center; padding:0}
  .size .dot{background:var(--ink); border-radius:50%}
  .size.on{background:var(--accent); border-radius:50%}
  .size.on .dot{background:#fff}
  :focus-visible{outline:3px solid var(--accent); outline-offset:3px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap">

<div class="bar">
  <div class="swatches" id="swatches" role="radiogroup" aria-label="الألوان"></div>
</div>

<div class="stage">
  <div class="wrap">
    <canvas id="paint" aria-label="لوحة الرسم"></canvas>
    <canvas id="lines" aria-hidden="true"></canvas>
  </div>
</div>

<div class="tray cats" id="cats" role="tablist" aria-label="نوع الرسمة">
  <button class="chip on" data-cat="pics">🎨 رسمات</button>
  <button class="chip" data-cat="letters">أ ب ت  حروف</button>
  <button class="chip" data-cat="none" style="margin-inline-start:auto">بلا رسمة</button>
</div>
<div class="tray" id="tray" aria-label="اختر رسمة"></div>

<div class="tools">
  <div class="sizes" role="radiogroup" aria-label="حجم القلم">
    <button class="size" data-size="6" aria-label="رفيع"><span class="dot" style="width:10px;height:10px"></span></button>
    <button class="size on" data-size="16" aria-label="وسط"><span class="dot" style="width:18px;height:18px"></span></button>
    <button class="size" data-size="34" aria-label="عريض"><span class="dot" style="width:28px;height:28px"></span></button>
  </div>
  <button class="btn on" id="brushBtn"><span class="ic">🖍️</span>ألوّن</button>
  <button class="btn" id="eraserBtn"><span class="ic">🧽</span>أمسح</button>
  <button class="btn" id="clearBtn"><span class="ic">✨</span>جديد</button>
</div>

<script>
  "use strict";
  var colors = ["#ff3b3b","#ff7a3d","#ffd21e","#39d353","#1ec8ff","#3d5bff","#b14dff","#ff5fa2","#7a4a27","#111111","#ffffff"];
  var paint = document.getElementById("paint"), pctx = paint.getContext("2d");
  var lines = document.getElementById("lines"), lctx = lines.getContext("2d");
  var state = { color:"#ff3b3b", size:16, erasing:false, template:null };
  var dpr = Math.max(1, Math.min(3, window.devicePixelRatio||1));

  /* ---------- أدوات الرسم ---------- */
  function box(x,y,w,h,mf){ var m=Math.min(w,h)*(mf||0.12); return {x:x+m,y:y+m,w:w-2*m,h:h-2*m,cx:x+w/2,cy:y+h/2,s:Math.min(w-2*m,h-2*m)}; }
  function pen(b){ lctx.strokeStyle="#111"; lctx.lineWidth=Math.max(4,b.s*0.03); lctx.lineJoin="round"; lctx.lineCap="round"; }

  /* ---------- الرسمات، كلٌّ داخل مربّعٍ يُعطى لها ---------- */
  var SHAPES = {
    star:function(b){ pen(b); var cx=b.cx,cy=b.cy,R=b.s*0.48,r=b.s*0.2; lctx.beginPath();
      for(var i=0;i<10;i++){ var a=-Math.PI/2+i*Math.PI/5, rad=(i%2?r:R), x=cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad; i?lctx.lineTo(x,y):lctx.moveTo(x,y);} lctx.closePath(); lctx.stroke(); },
    heart:function(b){ pen(b); var cx=b.cx,cy=b.cy,u=b.s*0.3; lctx.beginPath(); lctx.moveTo(cx,cy+u*1.2);
      lctx.bezierCurveTo(cx-u*1.8,cy-u*0.4,cx-u*0.9,cy-u*1.5,cx,cy-u*0.5);
      lctx.bezierCurveTo(cx+u*0.9,cy-u*1.5,cx+u*1.8,cy-u*0.4,cx,cy+u*1.2); lctx.closePath(); lctx.stroke(); },
    house:function(b){ pen(b); var x=b.cx-b.s*0.33,y=b.cy-b.s*0.05,s=b.s*0.66;
      lctx.strokeRect(x,y,s,s*0.7);
      lctx.beginPath(); lctx.moveTo(x-s*0.07,y); lctx.lineTo(b.cx,y-s*0.42); lctx.lineTo(x+s+s*0.07,y); lctx.stroke();
      lctx.strokeRect(x+s*0.38,y+s*0.3,s*0.24,s*0.4); },
    fish:function(b){ pen(b); var cx=b.cx,cy=b.cy,r=b.s*0.3;
      lctx.beginPath(); lctx.ellipse(cx+r*0.3,cy,r,r*0.62,0,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx-r*0.6,cy); lctx.lineTo(cx-r*1.4,cy-r*0.5); lctx.lineTo(cx-r*1.4,cy+r*0.5); lctx.closePath(); lctx.stroke();
      lctx.beginPath(); lctx.arc(cx+r*0.9,cy-r*0.18,r*0.1,0,Math.PI*2); lctx.stroke(); },
    flower:function(b){ pen(b); var cx=b.cx,cy=b.cy,R=b.s*0.17;
      for(var i=0;i<6;i++){ var a=i*Math.PI/3; lctx.beginPath(); lctx.arc(cx+Math.cos(a)*R*1.5,cy+Math.sin(a)*R*1.5,R,0,Math.PI*2); lctx.stroke(); }
      lctx.beginPath(); lctx.arc(cx,cy,R*0.8,0,Math.PI*2); lctx.stroke(); },
    sun:function(b){ pen(b); var cx=b.cx,cy=b.cy,R=b.s*0.22;
      lctx.beginPath(); lctx.arc(cx,cy,R,0,Math.PI*2); lctx.stroke();
      for(var i=0;i<12;i++){ var a=i*Math.PI/6; lctx.beginPath(); lctx.moveTo(cx+Math.cos(a)*R*1.35,cy+Math.sin(a)*R*1.35); lctx.lineTo(cx+Math.cos(a)*R*1.75,cy+Math.sin(a)*R*1.75); lctx.stroke(); } },
    car:function(b){ pen(b); var cx=b.cx,cy=b.cy,bw=b.s*0.7,bh=b.s*0.26,x=cx-bw/2,y=cy-bh/2;
      lctx.beginPath(); lctx.moveTo(x,y+bh); lctx.lineTo(x,y+bh*0.3); lctx.lineTo(x+bw*0.22,y+bh*0.3);
      lctx.lineTo(x+bw*0.34,y-bh*0.55); lctx.lineTo(x+bw*0.68,y-bh*0.55); lctx.lineTo(x+bw*0.8,y+bh*0.3);
      lctx.lineTo(x+bw,y+bh*0.3); lctx.lineTo(x+bw,y+bh); lctx.closePath(); lctx.stroke();
      lctx.beginPath(); lctx.arc(x+bw*0.27,y+bh,bh*0.42,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.arc(x+bw*0.73,y+bh,bh*0.42,0,Math.PI*2); lctx.stroke(); },
    balloon:function(b){ pen(b); var cx=b.cx,cy=b.cy-b.s*0.08,R=b.s*0.26;
      lctx.beginPath(); lctx.ellipse(cx,cy,R*0.82,R,0,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx,cy+R); lctx.lineTo(cx-R*0.12,cy+R*0.12+R); lctx.lineTo(cx+R*0.12,cy+R*0.12+R); lctx.closePath(); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx,cy+R*1.18); lctx.quadraticCurveTo(cx+R*0.5,cy+R*1.8,cx-R*0.2,cy+R*2.4); lctx.stroke(); },
    rabbit:function(b){ pen(b); var cx=b.cx,cy=b.cy+b.s*0.08,s=b.s;
      lctx.beginPath(); lctx.arc(cx,cy,s*0.22,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.ellipse(cx-s*0.1,cy-s*0.3,s*0.06,s*0.2,-0.12,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.ellipse(cx+s*0.1,cy-s*0.3,s*0.06,s*0.2,0.12,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.arc(cx-s*0.07,cy-s*0.02,s*0.022,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.arc(cx+s*0.07,cy-s*0.02,s*0.022,0,Math.PI*2); lctx.stroke(); },
    duck:function(b){ pen(b); var cx=b.cx,cy=b.cy,s=b.s;
      lctx.beginPath(); lctx.ellipse(cx-s*0.03,cy+s*0.14,s*0.27,s*0.18,0,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.arc(cx+s*0.19,cy-s*0.06,s*0.13,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx+s*0.31,cy-s*0.08); lctx.lineTo(cx+s*0.44,cy-s*0.04); lctx.lineTo(cx+s*0.31,cy+s*0.01); lctx.closePath(); lctx.stroke();
      lctx.beginPath(); lctx.arc(cx+s*0.21,cy-s*0.09,s*0.02,0,Math.PI*2); lctx.stroke(); },
    apple:function(b){ pen(b); var cx=b.cx,cy=b.cy+b.s*0.05,s=b.s;
      lctx.beginPath(); lctx.arc(cx,cy,s*0.24,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx,cy-s*0.2); lctx.lineTo(cx,cy-s*0.34); lctx.stroke();
      lctx.beginPath(); lctx.ellipse(cx+s*0.1,cy-s*0.3,s*0.09,s*0.045,-0.6,0,Math.PI*2); lctx.stroke(); },
    banana:function(b){ pen(b); var cx=b.cx,cy=b.cy,s=b.s;
      lctx.beginPath(); lctx.moveTo(cx-s*0.3,cy-s*0.14);
      lctx.quadraticCurveTo(cx+s*0.02,cy+s*0.36,cx+s*0.32,cy-s*0.06);
      lctx.quadraticCurveTo(cx+s*0.12,cy+s*0.2,cx-s*0.1,cy+s*0.22);
      lctx.quadraticCurveTo(cx-s*0.3,cy+s*0.08,cx-s*0.3,cy-s*0.14); lctx.closePath(); lctx.stroke(); },
    crescent:function(b){ pen(b); var cx=b.cx,cy=b.cy,R=b.s*0.3;
      lctx.beginPath();
      lctx.arc(cx-R*0.1,cy,R,Math.PI*0.42,Math.PI*1.58,false);
      lctx.arc(cx+R*0.35,cy,R*0.92,Math.PI*1.58,Math.PI*0.42,true);
      lctx.closePath(); lctx.stroke(); },
    ball:function(b){ pen(b); var cx=b.cx,cy=b.cy,R=b.s*0.27;
      lctx.beginPath(); lctx.arc(cx,cy,R,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx,cy-R); lctx.quadraticCurveTo(cx+R*0.6,cy,cx,cy+R); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx,cy-R); lctx.quadraticCurveTo(cx-R*0.6,cy,cx,cy+R); lctx.stroke();
      lctx.beginPath(); lctx.ellipse(cx,cy,R,R*0.42,0,0,Math.PI*2); lctx.stroke(); },
    snake:function(b){ pen(b); var x0=b.x+b.s*0.08,y=b.cy,A=b.s*0.15,L=b.s*0.78;
      lctx.beginPath(); for(var i=0;i<=40;i++){ var t=i/40,X=x0+L*t,Y=y+Math.sin(t*Math.PI*3)*A; i?lctx.lineTo(X,Y):lctx.moveTo(X,Y);} lctx.stroke();
      lctx.beginPath(); lctx.arc(x0+L,y,b.s*0.06,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(x0+L+b.s*0.06,y); lctx.lineTo(x0+L+b.s*0.14,y); lctx.stroke(); },
    mountain:function(b){ pen(b); var x=b.cx,base=b.cy+b.s*0.3,w=b.s*0.82;
      lctx.beginPath(); lctx.moveTo(x-w/2,base); lctx.lineTo(x-w*0.1,base-b.s*0.5); lctx.lineTo(x+w*0.05,base-b.s*0.25); lctx.lineTo(x+w*0.2,base-b.s*0.6); lctx.lineTo(x+w/2,base); lctx.closePath(); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(x+w*0.12,base-b.s*0.48); lctx.lineTo(x+w*0.2,base-b.s*0.6); lctx.lineTo(x+w*0.28,base-b.s*0.48); lctx.stroke(); },
    whale:function(b){ pen(b); var cx=b.cx,cy=b.cy+b.s*0.05,r=b.s*0.3;
      lctx.beginPath(); lctx.ellipse(cx,cy,r,r*0.7,0,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx+r*0.85,cy); lctx.lineTo(cx+r*1.3,cy-r*0.4); lctx.lineTo(cx+r*1.3,cy+r*0.4); lctx.closePath(); lctx.stroke();
      lctx.beginPath(); lctx.arc(cx-r*0.4,cy-r*0.12,r*0.08,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx-r*0.1,cy-r*0.68); lctx.lineTo(cx-r*0.1,cy-r*0.98); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx-r*0.1,cy-r*0.68); lctx.lineTo(cx+r*0.18,cy-r*0.98); lctx.stroke(); },
    tent:function(b){ pen(b); var cx=b.cx,base=b.cy+b.s*0.28,w=b.s*0.72,top=base-b.s*0.56;
      lctx.beginPath(); lctx.moveTo(cx-w/2,base); lctx.lineTo(cx,top); lctx.lineTo(cx+w/2,base); lctx.closePath(); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx,top); lctx.lineTo(cx,base); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx-w*0.14,base); lctx.lineTo(cx,base-b.s*0.22); lctx.lineTo(cx+w*0.14,base); lctx.stroke(); },
    bucket:function(b){ pen(b); var cx=b.cx,cy=b.cy,tw=b.s*0.5,bw=b.s*0.38,h=b.s*0.42,top=cy-h*0.3;
      lctx.beginPath(); lctx.moveTo(cx-tw/2,top); lctx.lineTo(cx+tw/2,top); lctx.lineTo(cx+bw/2,top+h); lctx.lineTo(cx-bw/2,top+h); lctx.closePath(); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx-tw/2,top); lctx.quadraticCurveTo(cx,top-b.s*0.28,cx+tw/2,top); lctx.stroke(); },
    corn:function(b){ pen(b); var cx=b.cx,cy=b.cy,w=b.s*0.22,h=b.s*0.36;
      lctx.beginPath(); lctx.ellipse(cx,cy,w,h,0,0,Math.PI*2); lctx.stroke();
      for(var i=-2;i<=2;i++){ lctx.beginPath(); lctx.moveTo(cx-w,cy+i*h*0.32); lctx.lineTo(cx+w,cy+i*h*0.32); lctx.stroke(); }
      lctx.beginPath(); lctx.moveTo(cx,cy-h); lctx.quadraticCurveTo(cx+w*1.8,cy-h*1.1,cx+w*0.5,cy-h*0.3); lctx.stroke(); },
    feather:function(b){ pen(b); var cx=b.cx;
      lctx.beginPath(); lctx.ellipse(cx,b.cy,b.s*0.13,b.s*0.34,0,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx,b.cy-b.s*0.34); lctx.lineTo(cx,b.cy+b.s*0.34); lctx.stroke(); },
    rocket:function(b){ pen(b); var cx=b.cx,cy=b.cy,w=b.s*0.26,h=b.s*0.5,top=cy-h*0.55;
      lctx.beginPath(); lctx.moveTo(cx,top); lctx.quadraticCurveTo(cx+w,top+h*0.3,cx+w*0.7,cy+h*0.35);
      lctx.lineTo(cx-w*0.7,cy+h*0.35); lctx.quadraticCurveTo(cx-w,top+h*0.3,cx,top); lctx.closePath(); lctx.stroke();
      lctx.beginPath(); lctx.arc(cx,cy-h*0.05,w*0.35,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx-w*0.7,cy+h*0.1); lctx.lineTo(cx-w*1.3,cy+h*0.45); lctx.lineTo(cx-w*0.5,cy+h*0.35); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx+w*0.7,cy+h*0.1); lctx.lineTo(cx+w*1.3,cy+h*0.45); lctx.lineTo(cx+w*0.5,cy+h*0.35); lctx.stroke(); },
    tooth:function(b){ pen(b); var cx=b.cx,cy=b.cy,w=b.s*0.4,top=cy-b.s*0.28;
      lctx.beginPath(); lctx.moveTo(cx-w/2,top+b.s*0.1);
      lctx.quadraticCurveTo(cx-w/2,top-b.s*0.08,cx,top);
      lctx.quadraticCurveTo(cx+w/2,top-b.s*0.08,cx+w/2,top+b.s*0.1);
      lctx.quadraticCurveTo(cx+w*0.4,cy+b.s*0.3,cx+w*0.18,cy+b.s*0.28);
      lctx.quadraticCurveTo(cx+w*0.05,cy+b.s*0.1,cx,cy+b.s*0.12);
      lctx.quadraticCurveTo(cx-w*0.05,cy+b.s*0.1,cx-w*0.18,cy+b.s*0.28);
      lctx.quadraticCurveTo(cx-w*0.4,cy+b.s*0.3,cx-w/2,top+b.s*0.1); lctx.closePath(); lctx.stroke(); },
    plane:function(b){ pen(b); var cx=b.cx,cy=b.cy,L=b.s*0.5;
      lctx.beginPath(); lctx.ellipse(cx,cy,L*0.5,b.s*0.12,0,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx-L*0.1,cy); lctx.lineTo(cx-L*0.3,cy-b.s*0.28); lctx.lineTo(cx+L*0.08,cy-b.s*0.03); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx-L*0.1,cy); lctx.lineTo(cx-L*0.3,cy+b.s*0.28); lctx.lineTo(cx+L*0.08,cy+b.s*0.03); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx-L*0.45,cy); lctx.lineTo(cx-L*0.62,cy-b.s*0.14); lctx.lineTo(cx-L*0.42,cy-b.s*0.02); lctx.stroke(); },
    envelope:function(b){ pen(b); var w=b.s*0.6,h=b.s*0.42,x=b.cx-w/2,y=b.cy-h/2;
      lctx.strokeRect(x,y,w,h);
      lctx.beginPath(); lctx.moveTo(x,y); lctx.lineTo(b.cx,b.cy); lctx.lineTo(x+w,y); lctx.stroke(); },
    eye:function(b){ pen(b); var cx=b.cx,cy=b.cy,w=b.s*0.4;
      lctx.beginPath(); lctx.moveTo(cx-w,cy); lctx.quadraticCurveTo(cx,cy-w*0.7,cx+w,cy); lctx.quadraticCurveTo(cx,cy+w*0.7,cx-w,cy); lctx.closePath(); lctx.stroke();
      lctx.beginPath(); lctx.arc(cx,cy,w*0.35,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.arc(cx,cy,w*0.14,0,Math.PI*2); lctx.stroke(); },
    cloud:function(b){ pen(b); var cx=b.cx,cy=b.cy,u=b.s*0.16;
      lctx.beginPath();
      lctx.arc(cx-u*1.6,cy+u*0.4,u,Math.PI*0.5,Math.PI*1.5);
      lctx.arc(cx-u*0.6,cy-u*0.4,u*1.1,Math.PI,Math.PI*1.85);
      lctx.arc(cx+u*0.9,cy-u*0.3,u,Math.PI*1.2,Math.PI*2);
      lctx.arc(cx+u*1.7,cy+u*0.4,u*0.9,Math.PI*1.6,Math.PI*0.5);
      lctx.closePath(); lctx.stroke(); },
    butterfly:function(b){ pen(b); var cx=b.cx,cy=b.cy,u=b.s*0.2;
      lctx.beginPath(); lctx.moveTo(cx,cy-u*0.8); lctx.lineTo(cx,cy+u*0.8); lctx.stroke();
      lctx.beginPath(); lctx.ellipse(cx-u*0.8,cy-u*0.5,u*0.8,u*0.6,0.5,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.ellipse(cx-u*0.8,cy+u*0.5,u*0.7,u*0.5,-0.5,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.ellipse(cx+u*0.8,cy-u*0.5,u*0.8,u*0.6,-0.5,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.ellipse(cx+u*0.8,cy+u*0.5,u*0.7,u*0.5,0.5,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx,cy-u*0.8); lctx.lineTo(cx-u*0.3,cy-u*1.3); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx,cy-u*0.8); lctx.lineTo(cx+u*0.3,cy-u*1.3); lctx.stroke(); },
    lemon:function(b){ pen(b); var cx=b.cx,cy=b.cy,w=b.s*0.3,h=b.s*0.22;
      lctx.beginPath(); lctx.ellipse(cx,cy,w,h,0,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx-w,cy); lctx.lineTo(cx-w-b.s*0.05,cy); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx+w,cy); lctx.lineTo(cx+w+b.s*0.05,cy); lctx.stroke(); },
    gift:function(b){ pen(b); var cx=b.cx,cy=b.cy,s=b.s*0.44,x=cx-s/2,y=cy-s*0.22;
      lctx.strokeRect(x,y,s,s*0.7);
      lctx.beginPath(); lctx.moveTo(cx,y); lctx.lineTo(cx,y+s*0.7); lctx.stroke();
      lctx.beginPath(); lctx.arc(cx-s*0.12,y-s*0.08,s*0.12,0,Math.PI*2); lctx.stroke();
      lctx.beginPath(); lctx.arc(cx+s*0.12,y-s*0.08,s*0.12,0,Math.PI*2); lctx.stroke(); },
    boat:function(b){ pen(b); var cx=b.cx,cy=b.cy,w=b.s*0.52;
      lctx.beginPath(); lctx.moveTo(cx-w/2,cy+b.s*0.12); lctx.lineTo(cx+w/2,cy+b.s*0.12); lctx.lineTo(cx+w*0.32,cy+b.s*0.32); lctx.lineTo(cx-w*0.32,cy+b.s*0.32); lctx.closePath(); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx,cy+b.s*0.12); lctx.lineTo(cx,cy-b.s*0.32); lctx.stroke();
      lctx.beginPath(); lctx.moveTo(cx,cy-b.s*0.32); lctx.lineTo(cx+w*0.4,cy); lctx.lineTo(cx,cy); lctx.closePath(); lctx.stroke(); }
  };

  /* قائمة الرسمات المرحة مع رموزها للأزرار */
  var PICLIST = [["star","⭐"],["heart","❤️"],["house","🏠"],["fish","🐟"],["flower","🌸"],["sun","☀️"],["car","🚗"],["balloon","🎈"]];
  /* الحروف: كل حرف مع صورة تبدأ به وكلمتها */
  var ABC = [
    ["أ","rabbit","أرنب"],["ب","duck","بطة"],["ت","apple","تفاحة"],["ث","snake","ثعبان"],
    ["ج","mountain","جبل"],["ح","whale","حوت"],["خ","tent","خيمة"],["د","bucket","دلو"],
    ["ذ","corn","ذرة"],["ر","feather","ريشة"],["ز","flower","زهرة"],["س","fish","سمكة"],
    ["ش","sun","شمس"],["ص","rocket","صاروخ"],["ض","tooth","ضرس"],["ط","plane","طائرة"],
    ["ظ","envelope","ظرف"],["ع","eye","عين"],["غ","cloud","غيمة"],["ف","butterfly","فراشة"],
    ["ق","crescent","قمر"],["ك","ball","كرة"],["ل","lemon","ليمونة"],["م","banana","موزة"],
    ["ن","star","نجمة"],["ه","gift","هدية"],["و","flower","وردة"],["ي","boat","يخت"]
  ];

  function accent(){ try{ return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#ff7a3d"; }catch(e){ return "#ff7a3d"; } }

  function picTemplate(name){ return function(w,h){ SHAPES[name](box(0,0,w,h)); }; }

  function letterCard(ch,picName,word){ return function(w,h){
    var areaH=h*0.84, bA, bB;
    if(h>=w){ bA={x:0,y:0,w:w,h:areaH*0.5}; bB={x:0,y:areaH*0.5,w:w,h:areaH*0.5}; }
    else { bA={x:0,y:0,w:w*0.5,h:areaH}; bB={x:w*0.5,y:0,w:w*0.5,h:areaH}; }
    // الحرف كبيراً بخطوطٍ تُلوَّن
    var lb=box(bA.x,bA.y,bA.w,bA.h,0.16), sz=lb.s*0.98;
    lctx.font="800 "+sz+"px 'Baloo Bhaijaan 2', sans-serif";
    lctx.textAlign="center"; lctx.textBaseline="middle"; lctx.lineJoin="round";
    lctx.strokeStyle="#111"; lctx.lineWidth=Math.max(6,sz*0.05);
    lctx.strokeText(ch, lb.cx, lb.cy);
    // الصورة
    SHAPES[picName](box(bB.x,bB.y,bB.w,bB.h,0.14));
    // الكلمة أسفل (ملوّنة سلفاً، للقراءة لا للتلوين)
    var fs=Math.max(18,Math.min(w,h)*0.07);
    lctx.font="800 "+fs+"px 'Baloo Bhaijaan 2', sans-serif";
    lctx.fillStyle=accent(); lctx.textBaseline="alphabetic";
    lctx.fillText(ch+" … "+word, w/2, h*0.955);
  };}

  /* ---------- الطبقتان وتغيير الحجم ---------- */
  function sizeCanvas(c){ var r=paint.getBoundingClientRect(); c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr); }
  function redrawLines(){ lctx.clearRect(0,0,lines.width,lines.height); if(state.template) state.template(lines.width,lines.height); }
  function resize(){
    var snap=null; try{ snap=(paint.width>0)?pctx.getImageData(0,0,paint.width,paint.height):null; }catch(e){}
    sizeCanvas(paint); sizeCanvas(lines);
    pctx.fillStyle="#fff"; pctx.fillRect(0,0,paint.width,paint.height);
    if(snap){ try{ pctx.putImageData(snap,0,0); }catch(e){} }
    pctx.lineCap="round"; pctx.lineJoin="round";
    redrawLines();
  }

  /* ---------- شريط الألوان ---------- */
  var sw=document.getElementById("swatches");
  colors.forEach(function(c,i){
    var b=document.createElement("button");
    b.className="sw"+(i===0?" on":""); b.style.background=c;
    b.setAttribute("role","radio"); b.setAttribute("aria-checked",i===0?"true":"false"); b.setAttribute("aria-label","لون");
    b.addEventListener("pointerdown",function(){
      state.color=c; state.erasing=false; setBrush(true);
      [].forEach.call(sw.children,function(x){x.classList.remove("on");x.setAttribute("aria-checked","false");});
      b.classList.add("on"); b.setAttribute("aria-checked","true");
    });
    sw.appendChild(b);
  });

  /* ---------- الأحجام ---------- */
  [].forEach.call(document.querySelectorAll(".size"),function(s){
    s.addEventListener("pointerdown",function(){
      state.size=Number(s.dataset.size);
      document.querySelectorAll(".size").forEach(function(x){x.classList.remove("on");});
      s.classList.add("on");
    });
  });

  /* ---------- القلم والممحاة ---------- */
  var brushBtn=document.getElementById("brushBtn"), eraserBtn=document.getElementById("eraserBtn");
  function setBrush(on){ state.erasing=!on; brushBtn.classList.toggle("on",on); eraserBtn.classList.toggle("on",!on); }
  brushBtn.addEventListener("pointerdown",function(){ setBrush(true); });
  eraserBtn.addEventListener("pointerdown",function(){ setBrush(false); });
  document.getElementById("clearBtn").addEventListener("pointerdown",function(){
    pctx.fillStyle="#fff"; pctx.fillRect(0,0,paint.width,paint.height);
  });

  /* ---------- صندوق الرسمات والحروف ---------- */
  var tray=document.getElementById("tray"), cats=document.getElementById("cats");
  function setTemplate(fn){ state.template=fn; pctx.fillStyle="#fff"; pctx.fillRect(0,0,paint.width,paint.height); redrawLines(); }
  function buildTray(cat){
    tray.innerHTML="";
    if(cat==="none"){ tray.hidden=true; setTemplate(null); return; }
    tray.hidden=false;
    if(cat==="pics"){
      PICLIST.forEach(function(p){
        var b=document.createElement("button"); b.className="pick"; b.textContent=p[1]; b.setAttribute("aria-label","رسمة");
        b.addEventListener("pointerdown",function(){ setTemplate(picTemplate(p[0])); }); tray.appendChild(b);
      });
    } else {
      ABC.forEach(function(it){
        var b=document.createElement("button"); b.className="pick pair"; b.setAttribute("aria-label","حرف "+it[0]+" "+it[2]);
        b.innerHTML="<span>"+it[0]+"</span><small>"+it[2]+"</small>";
        b.addEventListener("pointerdown",function(){ setTemplate(letterCard(it[0],it[1],it[2])); }); tray.appendChild(b);
      });
    }
  }
  [].forEach.call(cats.children,function(chip){
    chip.addEventListener("pointerdown",function(){
      [].forEach.call(cats.children,function(x){x.classList.remove("on");}); chip.classList.add("on");
      buildTray(chip.dataset.cat);
    });
  });

  /* ---------- الرسم ---------- */
  var drawing=false,lastX=0,lastY=0;
  function pos(e){ var r=paint.getBoundingClientRect(); return {x:(e.clientX-r.left)*dpr,y:(e.clientY-r.top)*dpr}; }
  function dot(x,y){ pctx.beginPath(); pctx.fillStyle=state.erasing?"#fff":state.color; pctx.arc(x,y,(state.size*dpr)/2,0,Math.PI*2); pctx.fill(); }
  paint.addEventListener("pointerdown",function(e){ e.preventDefault(); drawing=true; try{paint.setPointerCapture(e.pointerId);}catch(_){} var p=pos(e); lastX=p.x; lastY=p.y; dot(p.x,p.y); });
  paint.addEventListener("pointermove",function(e){
    if(!drawing) return; e.preventDefault();
    var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[e];
    for(var i=0;i<evs.length;i++){ var p=pos(evs[i]);
      pctx.strokeStyle=state.erasing?"#fff":state.color; pctx.lineWidth=state.size*dpr;
      pctx.beginPath(); pctx.moveTo(lastX,lastY); pctx.lineTo(p.x,p.y); pctx.stroke(); lastX=p.x; lastY=p.y; }
  });
  function stop(){ drawing=false; }
  paint.addEventListener("pointerup",stop); paint.addEventListener("pointercancel",stop); paint.addEventListener("pointerleave",stop);

  window.addEventListener("resize",resize);
  resize();
  buildTray("pics");
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(redrawLines); }
</script>
