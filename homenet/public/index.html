<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f141b">
<title>شبكة البيت</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="login hidden">
  <form class="login-box" id="loginForm">
    <h1>شبكة البيت</h1>
    <p>اكتب رمز الدخول</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••">
    <button type="submit">دخول</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<header class="top">
  <div class="brand">
    <span class="dot" id="liveDot"></span>
    <strong>شبكة البيت</strong>
  </div>
  <div class="kpis" id="kpis"></div>
  <button class="danger" id="pauseBtn">قطع النت</button>
</header>

<nav class="tabs">
  <button data-tab="live" class="active">الآن</button>
  <button data-tab="devices">الأجهزة</button>
  <button data-tab="log">السجل</button>
  <button data-tab="rules">القواعد</button>
  <button data-tab="settings">الإعدادات</button>
</nav>

<main>
  <section id="tab-live" class="tab active">
    <div id="alertBox"></div>
    <div class="bar">
      <input id="liveFilter" placeholder="تصفية: اكتب اسم موقع أو جهاز…">
      <label class="chk"><input type="checkbox" id="onlyBlocked"> المحجوب فقط</label>
      <label class="chk"><input type="checkbox" id="paused"> إيقاف التمرير</label>
    </div>
    <div id="liveList" class="list"></div>
  </section>

  <section id="tab-devices" class="tab">
    <div id="deviceList" class="cards"></div>
  </section>

  <section id="tab-log" class="tab">
    <div class="bar">
      <select id="logDay"></select>
      <select id="logDev"><option value="">كل الأجهزة</option></select>
      <select id="logAct">
        <option value="">الكل</option>
        <option value="block">المحجوب</option>
        <option value="allow">المسموح</option>
      </select>
      <input id="logQ" placeholder="ابحث عن موقع…">
      <button id="logGo">بحث</button>
    </div>
    <div class="split">
      <div id="logList" class="list"></div>
      <aside id="topSites" class="panel"></aside>
    </div>
  </section>

  <section id="tab-rules" class="tab">
    <div id="profiles"></div>
    <div class="panel">
      <h3>قوائم عامة لكل البيت</h3>
      <div class="row">
        <input id="ruleDomain" placeholder="example.com">
        <button data-rule="block">احجب</button>
        <button data-rule="allow" class="ghost">اسمح دائماً</button>
      </div>
      <div class="cols">
        <div><h4>محجوب</h4><div id="globalBlock" class="chips"></div></div>
        <div><h4>مسموح دائماً</h4><div id="globalAllow" class="chips"></div></div>
      </div>
    </div>
  </section>

  <section id="tab-settings" class="tab">
    <div id="settings"></div>
  </section>
</main>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
